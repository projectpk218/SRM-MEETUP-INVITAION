<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc"><title id="title">[EVENT_BRAND] alumni invitation</title><desc id="desc">[EVENT_DATE]; [EVENT_TIME] [TIME_ZONE]; [VENUE_NAME]. RSVP by [RSVP_DEADLINE].</desc><g id="background"><rect width="1080" height="1920" fill="#F7F2E8"/><rect width="1080" height="785" fill="#0B1F33"/></g><g id="logo-placeholder" fill="#F7F2E8" font-family="Arial" font-size="20"><text x="76" y="190">[INSTITUTION_LOGO_ASSET]</text></g><g id="institution" fill="#F7F2E8" font-family="Arial" font-size="28"><text x="76" y="286">[INSTITUTION]</text></g><g id="descriptor" fill="#F7F2E8" font-family="Arial" font-size="21"><text x="76" y="326">Alumni invitation · [CLASS_YEARS_OR_COHORT]</text></g><g id="connection-motif" stroke="#B08D57" stroke-width="2" fill="none" opacity="0.7"><path d="M815 769V665a90 90 0 0 1 180 0v104M840 769V665a65 65 0 0 1 130 0v104"/></g><g id="event-brand" fill="#F7F2E8" font-family="Georgia" font-size="76"><text x="76" y="448">[EVENT_BRAND]</text></g><g id="tagline" fill="#F7F2E8" font-family="Georgia" font-size="32"><text x="76" y="560.64">Where journeys reconnect.</text></g><g id="headline" fill="#F7F2E8" font-family="Arial" font-size="25"><text x="76" y="628">A Distinguished Gathering of Alumni</text></g><g id="hook" fill="#F7F2E8" font-family="Arial" font-size="27"><text x="76" y="685">Reconnect with the people, ideas, and institution that</text><text x="76" y="720.1">shaped your journey.</text></g><path d="M76 785H1004" stroke="#B08D57" stroke-width="2"/><g id="date" fill="#0B1F33" font-family="Georgia" font-size="37"><text x="76" y="857">[EVENT_DATE]</text></g><g id="time" fill="#1F2933" font-family="Arial" font-size="27"><text x="76" y="910.1">[EVENT_TIME] · [TIME_ZONE]</text></g><g id="venue" fill="#0B1F33" font-family="Georgia" font-size="34"><text x="76" y="965.2">[VENUE_NAME]</text></g><g id="mode" fill="#1F2933" font-family="Arial" font-size="21"><text x="76" y="1011.4000000000001">[EVENT_MODE]</text></g><g id="address" fill="#1F2933" font-family="Arial" font-size="23"><text x="76" y="1042.7">[VENUE_ADDRESS]</text></g><g id="invitation" fill="#1F2933" font-family="Arial" font-size="27"><text x="76" y="1094.6000000000001">Join fellow alumni for [EVENT_BRAND], a gathering of reflection, meaningful</text><text x="76" y="1132.94">conversation, and renewed connection at [INSTITUTION]. Celebrate the</text><text x="76" y="1171.2800000000002">journey so far while looking ahead to the chapters still to be written.</text></g><path d="M76 1217.6200000000001H1004" stroke="#B08D57" stroke-width="2"/><g id="speaker" fill="#1F2933" font-family="Arial" font-size="26"><text x="76" y="1257.6200000000001">Featuring [KEYNOTE_NAME] · [KEYNOTE_TITLE]</text></g><g id="hosts" fill="#1F2933" font-family="Arial" font-size="23"><text x="76" y="1298.42">Hosted by [HOSTS]</text></g><g id="agenda-1" fill="#1F2933" font-family="Arial" font-size="25"><text x="76" y="1340.3200000000002">01 [AGENDA_HIGHLIGHT_1]</text></g><g id="agenda-2" fill="#1F2933" font-family="Arial" font-size="25"><text x="76" y="1384.8200000000002">02 [AGENDA_HIGHLIGHT_2]</text></g><g id="agenda-3" fill="#1F2933" font-family="Arial" font-size="25"><text x="76" y="1429.3200000000002">03 [AGENDA_HIGHLIGHT_3]</text></g><g id="dress" fill="#1F2933" font-family="Arial" font-size="24"><text x="76" y="1479.8200000000002">Dress: [DRESS_CODE]</text></g><g id="cta"><rect x="76" y="1604" width="570" height="78" rx="2" fill="#0B1F33"/><g id="cta-label" fill="#F7F2E8" font-family="Arial" font-size="28"><text x="104" y="1653">Reserve Your Place</text></g></g><g id="deadline" fill="#1F2933" font-family="Arial" font-size="24"><text x="76" y="1720">RSVP by [RSVP_DEADLINE]</text></g><g id="rsvp-url" fill="#1F2933" font-family="Arial" font-size="23"><text x="76" y="1756">[RSVP_URL]</text></g><g id="contact" fill="#1F2933" font-family="Arial" font-size="21"><text x="76" y="184